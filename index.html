<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Tempered Glass</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="icon" type="image/png" href="logo.png">

  <style>
    @keyframes scaleUp {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-scaleUp {
      animation: scaleUp 0.2s ease-in-out;
    }
  </style>
</head>

<body class="bg-gray-200">

<!-- NAVBAR -->
<header class="fixed top-0 left-0 w-full bg-white shadow z-50">
  <div class="flex items-center justify-between px-4 py-3">

    <div class="flex items-center gap-2">
      <img src="logo.png" class="h-8">
      <span class="font-bold">TG Store</span>
    </div>

    <!-- RIGHT SIDE -->
<div class="flex items-center gap-4">

  <!-- SEARCH -->
  <div class="flex items-center relative">

    <!-- SEARCH BOX -->
    <div 
      id="searchbox"
      class="
      hidden
      absolute
      top-12
      right-0
      w-72
      bg-white
      p-3
      rounded-xl
      shadow-lg
      z-50

      opacity-0
      -translate-y-5

      transition-all
      duration-300
      ease-in-out

      md:static
      md:opacity-100
      md:translate-y-0
      md:shadow-none
      md:bg-transparent
      md:p-0
      md:w-auto
      md:flex
      ">

      <div class="flex items-center gap-2">

        <input 
          type="text"
          id="searchInput"
          placeholder="Cari HP..."
          class="border rounded-lg px-3 py-2 text-sm w-full outline-none"
        >

        <!-- CLOSE -->
        <button
          onclick="toggleSearch()"
          class="md:hidden text-xl">

          <i class="bi bi-x-lg"></i>

        </button>

      </div>

    </div>

    <!-- SEARCH ICON -->
    <i
      onclick="toggleSearch()"
      class="bi bi-search text-black text-xl md:hidden cursor-pointer">
    </i>

  </div>

  <!-- PROFILE MOBILE -->
<div class="relative md:hidden">

  <button
    onclick="toggleProfileMenu()"
    id="profileButton"
    class="flex items-center">

    <img
      id="navProfileImage"
      class="w-9 h-9 rounded-full border">

  </button>

  <!-- DROPDOWN -->
  <div
    id="profileDropdown"
    class="hidden absolute right-0 top-12 w-52 bg-white rounded-xl shadow-lg p-3 z-50">

    <div class="flex items-center gap-3 mb-3">

      <img
        id="dropdownProfileImage"
        class="w-10 h-10 rounded-full">

      <div>

        <h3
          id="dropdownProfileName"
          class="font-bold text-sm">
        </h3>

        <p
          id="dropdownProfileRole"
          class="text-xs text-gray-500">
        </p>

      </div>

    </div>

    <button
      onclick="openSettings()"
      class="w-full text-left px-3 py-2 rounded hover:bg-gray-100">

      <i class="bi bi-gear mr-2"></i>
      Pengaturan

    </button>

    <button
      onclick="logoutUser()"
      class="w-full text-left px-3 py-2 rounded text-red-500 hover:bg-red-50">

      <i class="bi bi-box-arrow-right mr-2"></i>
      Logout

    </button>

  </div>

</div>

  
</div>
</header>

<!-- CONTENT -->
<main class="pt-20 md:ml-64 px-4 pb-24 max-w-5xl mx-auto">

  <h1 class="text-2xl font-bold mb-4">
    Daftar Tempered Glass
  </h1>

  <div class="grid gap-4">

    <button
      id="btnTambah"
      style="display:none;"
      onclick="toggleForm()"
      class="flex justify-center bg-green-500 text-white w-full max-w-sm mx-auto my-8 px-3 py-3 rounded">

      Tambah Data

    </button>

    <!-- FORM -->
    <div id="inputData"
    class="hidden bg-white p-4 rounded shadow mb-4 animate-scaleUp">

      <input id="nama_hp"
      placeholder="Nama HP"
      class="border p-2 w-full mb-2">

      <input id="tipe"
      placeholder="Tipe HP"
      class="border p-2 w-full mb-2">

      <input id="layar"
      placeholder="Ukuran Layar"
      class="border p-2 w-full mb-2">

      <input id="tempered"
      placeholder="Nama Tempered Glass"
      class="border p-2 w-full mb-2">

      <button
        id="saveBtn"
        onclick="tambahData()"
        class="bg-green-500 text-white px-3 py-2 rounded w-full">

        Simpan Data

      </button>

      <button
        onclick="toggleForm()"
        class="bg-gray-400 text-white px-3 py-2 rounded w-full mt-2">

        Batal

      </button>

    </div>

    <!-- DATA -->
    <div id="dataList" class="mt-4"></div>

  </div>

</main>

<!-- SETTINGS -->
<div id="settingsPage"
class="hidden fixed inset-0 w-full h-full bg-gray-100 z-[999] overflow-y-auto">

  <!-- HEADER -->
  <div class="bg-white p-4 shadow flex justify-between items-center">

    <button onclick="closeSettings()"
    class="text-3xl hover:scale-110 transition">

      <i class="bi bi-arrow-left-circle-fill"></i>

    </button>

    <h2 class="text-xl font-bold">
      Pengaturan
    </h2>

    <div></div>

  </div>


<!-- PROFILE POPUP -->
<div
  id="profilePopup"
  class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center">

  <div class="bg-white rounded-2xl p-6 w-80 shadow-xl">

    <div class="flex flex-col items-center">

      <img
        id="popupProfileImage"
        class="w-20 h-20 rounded-full border mb-3">

      <h2
        id="popupProfileName"
        class="font-bold text-lg">
      </h2>

      <p
        id="popupProfileRole"
        class="text-gray-500 text-sm">
      </p>

    </div>

    <div class="mt-6 space-y-2">

      <button
        onclick="openSettings()"
        class="w-full bg-gray-100 py-2 rounded-lg">

        Pengaturan

      </button>

      <button
        onclick="logoutUser()"
        class="w-full bg-red-500 text-white py-2 rounded-lg">

        Logout

      </button>

      <button
        onclick="closeProfilePopup()"
        class="w-full bg-gray-300 py-2 rounded-lg">

        Tutup

      </button>

    </div>

  </div>

</div>

  <!-- CONTENT -->
  <div class="p-4 space-y-4">

    <div id="settingsContent" class="p-4"></div>

    <!-- PROFILE -->
    <div class="bg-white rounded-xl p-4 shadow">

      <div class="flex items-center gap-3">

        <img id="profileImage"
        class="w-14 h-14 rounded-full border">

        <div>

          <h3 id="profileName"
          class="font-bold text-lg">
            User
          </h3>

          <p id="profileRole"
          class="text-gray-500 text-sm">
            Role
          </p>

        </div>

      </div>

    </div>

    <!-- ADMIN -->
    <div id="adminMenu"
    class="space-y-3 hidden">

      <button
      onclick="openUserManagement()"
      class="w-full bg-white p-4 rounded-xl shadow flex items-center justify-between">

        <div class="flex items-center gap-3">

          <i class="bi bi-person-check text-2xl text-green-500"></i>

          <div class="text-left">

            <h3 class="font-bold">
              Aktivasi Akun
            </h3>

            <p class="text-sm text-gray-500">
              Verifikasi user baru
            </p>

          </div>

        </div>

        <i class="bi bi-chevron-right"></i>

      </button>

      <!-- STOK GUDANG -->
<button
onclick="openStockPage()"
class="w-full bg-white p-4 rounded-xl shadow flex items-center justify-between">

  <div class="flex items-center gap-3">

    <i class="bi bi-box-seam text-2xl text-blue-500"></i>

    <div class="text-left">

      <h3 class="font-bold">
        Stok Gudang
      </h3>

      <p class="text-sm text-gray-500">
        Kelola stok tempered glass
      </p>

    </div>

  </div>

  <i class="bi bi-chevron-right"></i>

</button>
    </div>

    <!-- LOGOUT -->
    <button
    onclick="logoutUser()"
    class="w-full bg-red-500 text-white p-4 rounded-xl shadow">

      Logout

    </button>

  </div>

</div>

<!-- SIDEBAR -->
<aside class="hidden md:flex fixed top-16 left-0 h-full w-64 bg-white shadow-lg flex-col p-4 z-40">

  <!-- PROFILE DESKTOP -->
<div class="hidden md:block mb-6">

  <button
    onclick="openProfilePopup()"
    class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-gray-100 transition">

    <img
      id="sidebarProfileImage"
      class="w-12 h-12 rounded-full border">

    <div class="text-left">

      <h3
        id="sidebarProfileName"
        class="font-bold text-sm">
        User
      </h3>

      <p
        id="sidebarProfileRole"
        class="text-xs text-gray-500">
        Role
      </p>

    </div>

  </button>

  <div class="space-y-2">

  <a href="#"
  class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100">

    <i class="bi bi-house text-lg"></i>
    <span>Beranda</span>

  </a>

</div>

</div>
</aside>

<!-- MOBILE NAV -->
<nav class="fixed bottom-0 left-0 w-full bg-white shadow md:hidden border-t z-40">

  <div class="flex justify-around text-center text-sm py-2">


  </div>

</nav>

<script type="module" src="./js/app.js?v=3"></script>
<script type="module" src="./js/settings.js?v=3"></script>

</body>
</html>
