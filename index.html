<script type="module">
  // Import Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getAuth, 
    signInWithPopup, 
    GoogleAuthProvider,
    onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import { 
    getFirestore, 
    collection, 
    addDoc, 
    getDocs,
    updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // 🔑 GANTI dengan config dari Firebase kamu
  const firebaseConfig = {
    apiKey: "AIzaSyCU-cFfdkTw4m3CBVW2Ng_pOXz8ivvIU4E",
    authDomain: "temperedlist.firebaseapp.com",
    projectId: "temperedlist",
    storageBucket: "temperedlist.firebasestorage.app",
    messagingSenderId: "191609705338",
    appId: "1:191609705338:web:293729cf40756d3e0dfcc3",
    measurementId: "G-FYRF7E8VB8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let userRole = null; // 🔥 WAJIB ADA
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  window.approveUser = async function(uid) {
  try {

    await updateDoc(doc(db, "users", uid), {
      status: "active"
    });

    alert("User berhasil diverifikasi!");

    loadUsers();

  } catch (e) {
    console.error(e);
    alert(e.message);
  }
};

  // 👉 LOGIN
  window.loginGoogle = function () {
    signInWithPopup(auth, provider)
      .then((result) => {
        console.log("Login sukses:", result.user);
      })
      .catch((error) => {
        console.error(error);console.error("Login error:", error);
        alert(error.message); // 🔥 tampilkan error ke user
      });
  };

  // 👉 LOGOUT
 window.logoutUser = function () {
  signOut(auth).then(() => {
    window.location.href = "auth.html";
  });
};

  // 👉 CEK STATUS LOGIN
onAuthStateChanged(auth, async (user) => {
  const profile = document.getElementById("profileArea");
  currentUser = user;

  // ❌ kalau belum login → lempar ke auth
  if (!user) {
    window.location.href = "auth.html";
    return;
  }

  try {
    // 🔥 ambil role dari Firestore
    const docRef = doc(db, "users", user.uid);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
      userRole = docSnap.data().role;
    } else {
      userRole = "karyawan";
    }

    // tampilkan profile
    profile.innerHTML = `
      <img src="${user.photoURL}" class="w-8 h-8 rounded-full">
      <span class="text-sm">${userRole}</span>
      <button onclick="logoutUser()" class="text-red-500">Logout</button>
    `;

    updateUIByRole();

  } catch (e) {
    console.error(e);
    alert("Gagal ambil data user");
  }
});
      window.toggleForm = function () {
  const form = document.getElementById("inputData");
  form.classList.toggle("hidden");
};


    // ✅ TAMBAH DATA (FIX)
  window.tambahData = async function () {

  if (!currentUser) {
    alert("Login dulu!");
    return;
  }
  if (userRole === "karyawan") {
  alert("Kamu tidak punya akses!");
  return;
}

  // ambil value dari input
  const nama_hp = document.getElementById("nama_hp").value;
  const tipe = document.getElementById("tipe").value;
  const layar = document.getElementById("layar").value;
  const tempered = document.getElementById("tempered").value;

  // validasi sederhana
  if (!nama_hp.trim() || !tipe.trim() || !layar.trim() || !tempered.trim()) {
    alert("Semua field harus diisi!");
    return;
  }

  try {
    await addDoc(collection(db, "tempered_glass"), {
      nama_hp,
      tipe,
      layar,
      tempered
    });

    alert("Data berhasil ditambahkan!");

    // reset input
    document.getElementById("nama_hp").value = "";
    document.getElementById("tipe").value = "";
    document.getElementById("layar").value = "";
    document.getElementById("tempered").value = "";

    loadData();
  } catch (e) {
    console.error(e);
    alert(e.message);
  }
};

  async function loadData() {

  const container = document.getElementById("dataList");

  const querySnapshot = await getDocs(
    collection(db, "tempered_glass")
  );

  container.innerHTML = "";

  querySnapshot.forEach((docSnap) => {

    const item = docSnap.data();

    container.innerHTML += `
      <div class="bg-white p-4 rounded shadow mb-2">

        <h2 class="font-bold">
          ${item.nama_hp}
        </h2>

        <p>${item.tipe}</p>
        <p>${item.layar}</p>

        <p class="text-blue-500">
          ${item.tempered}
        </p>

      </div>
    `;
  });
}


async function loadUsers() {
  const container = document.getElementById("userList");
  const querySnapshot = await getDocs(collection(db, "users"));

  container.innerHTML = "";

  querySnapshot.forEach((docSnap) => {
    const data = docSnap.data();

    container.innerHTML += `
   <div class="flex justify-between items-center border-b py-2">

    <div>
      <p class="text-sm font-bold">${data.email}</p>
      <p class="text-xs text-gray-500">
        Role: ${data.role}
      </p>

      <p class="text-xs">
        Status: ${data.status || "pending"}
      </p>
    </div>

    <div class="flex gap-2">

      <select onchange="ubahRole('${docSnap.id}', this.value)"
      class="border p-1 text-sm">

        <option value="karyawan"
        ${data.role === "karyawan" ? "selected" : ""}>
        Karyawan
        </option>

        <option value="admin_acc1"
        ${data.role === "admin_acc1" ? "selected" : ""}>
        Admin Acc 1
        </option>

        <option value="administrator"
        ${data.role === "administrator" ? "selected" : ""}>
        Administrator
        </option>

      </select>

      <!-- 🔥 TOMBOL APPROVE -->
      <button
        onclick="approveUser('${docSnap.id}')"
        class="bg-green-500 text-white px-2 py-1 rounded text-sm">

        Approve
      </button>

    </div>
  </div>
    `;
  });
};

window.ubahRole = async function (uid, roleBaru) {
  try {
    await updateDoc(doc(db, "users", uid), {
      role: roleBaru
    });

    alert("Role berhasil diubah!");
    loadUsers();

  } catch (e) {
    console.error(e);
    alert("Gagal update role");
  }
};

window.openSettings = function () {

  if (userRole !== "administrator") {
    alert("Hanya admin!");
    return;
  }

  document
    .getElementById("settingsPage")
    .classList.remove("hidden");

  loadUsers();
};

window.closeSettings = function () {
  document
    .getElementById("settingsPage")
    .classList.add("hidden");
};

function updateUIByRole() {
  const btn = document.getElementById("btnTambah");
  const adminPanel = document.getElementById("adminPanel");

  if (!currentUser || userRole === "karyawan") {
    btn.style.display = "none";
    adminPanel.classList.add("hidden");
  } else {
    btn.style.display = "block";
  }

  // 👑 hanya administrator
  if (userRole === "administrator") {
    adminPanel.classList.remove("hidden");
    loadUsers(); // 🔥 load data user
  } else {
    adminPanel.classList.add("hidden");
  }
}

  loadData();
</script>
