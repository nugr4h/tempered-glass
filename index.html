<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Tempered Glass</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <style>
@keyframes scaleUp {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.animate-scaleUp {
  animation: scaleUp 0.2s ease-in-out;
}

</style>
</head>

<body class="bg-gray-200">


<main class="pt-20 md:ml-64 px-4">
<!-- 🔝 NAVBAR -->
<header class="fixed top-0 left-0 w-full bg-white shadow z-50">
  <div class="flex items-center justify-between px-4 py-3">

    <!-- Logo -->
    <div class="flex items-center gap-2">
      <img src="logo.png" class="h-8" alt="">
      <span class="font-bold">TG Store</span>
    </div>

    <!-- Search + Profile -->
    <div id="Glass" class="flex items-center gap-3">

      <!-- Search -->
      <div class="hidden md:block">
        <input 
          type="text" 
          placeholder="Cari HP..." 
          class="border rounded-lg px-3 py-1 text-sm"
        >
      </div>

      <!-- Icon Search Mobile -->
      <i class="bi bi-search text-xl md:hidden"></i>

      <!-- Profile -->
        <div id="profileArea" class="flex items-center gap-2 rounded">
         <!-- nanti diisi otomatis oleh Firebase -->
        </div>
    </div>

  </div>
</header>

<!-- 📦 CONTENT -->

  <h1 class="text-2xl font-bold mb-4">Daftar Tempered Glass</h1>

  <!-- Contoh Card -->
  <div class=" grid gap-4">

    <button id="btnTambah" style="display: none;" onclick="toggleForm()" class="flex justify-center bg-green-500 text-white w-80 mx-10 my-8 px-3 py-3">
     Tambah Data
    </button>

  <div id="inputData" class="hidden bg-white p-4 rounded shadow mb-4 animate-scaleUp">
    <input id="nama_hp" placeholder="Nama HP" class="border p-2 w-full mb-2">
    <input id="tipe" placeholder="Tipe HP" class="border p-2 w-full mb-2">
    <input id="layar" placeholder="Ukuran Layar (inci)" class="border p-2 w-full mb-2">
    <input id="tempered" placeholder="Nama Tempered Glass" class="border p-2 w-full mb-2">

  <button onclick="tambahData()" class="bg-green-500 text-white px-3 py-1 rounded w-full">
    Simpan Data
  </button>
  <button onclick="toggleForm()" class="bg-gray-400 text-white px-3 py-1 rounded w-full mt-2">
  Batal
</button>
</div>
    <div id="dataList" class="mt-4"></div>

  </div>
 

</main>

<!-- ⚙️ SETTINGS -->
<div id="settingsPage"
class="hidden fixed inset-0 bg-gray-100 z-50 overflow-auto">

  <!-- HEADER -->
  <div class="bg-white p-4 shadow flex justify-between items-center">

    <button onclick="closeSettings()"
    class="text-3xl hover:scale-110 transition">

      <i class="bi bi-arrow-left-circle-fill"></i>

    </button>

    <h2 class="text-xl font-bold">
      Pengaturan
    </h2>

    <div></div>

  </div>

  <!-- MENU -->
  <div class="p-4 space-y-4">
    <div id="settingsContent" class="p-4"></div>
    <!-- 👤 PROFIL -->
    <div class="bg-white rounded-xl p-4 shadow">

      <div class="flex items-center gap-3">

        <img id="profileImage"
        class="w-14 h-14 rounded-full border">

        <div>

          <h3 id="profileName"
          class="font-bold text-lg">
          User
          </h3>

          <p id="profileRole"
          class="text-gray-500 text-sm">
          Role
          </p>

        </div>

      </div>

    </div>

    <!-- 🔥 ADMIN MENU -->
    <div id="adminMenu" class="space-y-3 hidden">

      <!-- Aktivasi akun -->
      <button
      onclick="openUserManagement()"
      class="w-full bg-white p-4 rounded-xl shadow flex items-center justify-between">

        <div class="flex items-center gap-3">

          <i class="bi bi-person-check text-2xl text-green-500"></i>

          <div class="text-left">

            <h3 class="font-bold">
              Aktivasi Akun
            </h3>

            <p class="text-sm text-gray-500">
              Verifikasi user baru
            </p>

          </div>

        </div>

        <i class="bi bi-chevron-right"></i>

      </button>

      <!-- stok gudang -->
      <button
      onclick="openStockPage()"
      class="w-full bg-white p-4 rounded-xl shadow flex items-center justify-between">

        <div class="flex items-center gap-3">

          <i class="bi bi-box-seam text-2xl text-black-500"></i>

          <div class="text-left">

            <h3 class="font-bold">
              Stok Gudang
            </h3>

            <p class="text-sm text-gray-500">
              Kelola stok tempered glass
            </p>

          </div>

        </div>

        <i class="bi bi-chevron-right"></i>

      </button>

    </div>

    <!-- 🚪 LOGOUT -->
    <button
    onclick="logoutUser()"
    class="w-full bg-red-500 text-white p-4 rounded-xl shadow">

      Logout

    </button>

  </div>
  
</div>

<aside class="hidden md:flex fixed top-16 left-0 h-full w-64 bg-white shadow-lg flex-col p-4 z-40">

  <!-- MENU -->
  <div class="space-y-2">

    <a href="#"
      class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 transition">

      <i class="bi bi-house text-lg"></i>
      <span>Beranda</span>

    </a>

    <a href="#"
      onclick="openSettings()"
      class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 transition">

      <i class="bi bi-gear text-lg"></i>
      <span>Pengaturan</span>

    </a>

    <a href="#"
      class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 transition">

      <i class="bi bi-person text-lg"></i>
      <span>Profil</span>

    </a>

  </div>

</aside>

<nav class="fixed bottom-0 left-0 w-full bg-white shadow md:hidden border-t">

  <div class="flex justify-around text-center text-sm py-2">

    <a href="#" class="flex flex-col items-center text-gray-700">
      <i class="bi bi-house text-lg"></i>
      <span>Beranda</span>
    </a>

    <a href="#" onclick="openSettings()"
      class="flex flex-col items-center text-gray-700">

      <i class="bi bi-gear text-lg"></i>
      <span>Pengaturan</span>

    </a>

    <a href="#" class="flex flex-col items-center text-gray-700">
      <i class="bi bi-person text-lg"></i>
      <span>Profil</span>
    </a>

  </div>
</nav>

<script type="module" src="js/app.js"></script>

</body>
</html>
